<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Request System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5e6f3 0%, #e6f3f5 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #d4a5d9;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #a8a8a8;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #6b6b6b;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #f0e6f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            background-color: #faf8fc;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #d4a5d9;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(212, 165, 217, 0.1);
        }

        input:disabled,
        select:disabled {
            background-color: #f0f0f0;
            color: #999;
            cursor: not-allowed;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #d4a5d9 0%, #c49acc 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 165, 217, 0.3);
        }

        .btn-reset {
            background: linear-gradient(135deg, #c2dfe3 0%, #a8d5e0 100%);
            color: #2c5f6f;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(168, 213, 224, 0.3);
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .alert.success {
            background-color: #d4f1d4;
            color: #2d6a2d;
            border-left: 4px solid #4caf50;
            display: block;
        }

        .alert.error {
            background-color: #fde6e6;
            color: #a52a2a;
            border-left: 4px solid #f44336;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f0e6f0;
            border-top: 3px solid #d4a5d9;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .required {
            color: #e8a0a0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-calendar-check"></i> Reservation Request</h1>
            <p>Please fill in the form below to request a reservation</p>
        </div>

        <div id="alertMessage" class="alert"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #d4a5d9;">Submitting your reservation...</p>
        </div>

        <form id="reservationForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="contract">Contract <span class="required">*</span></label>
                    <select id="contract" name="contract" required>
                        <option value="">Select a contract</option>
                        <option value="Contract A">Contract A</option>
                        <option value="Contract B">Contract B</option>
                        <option value="Contract C">Contract C</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="place">Place <span class="required">*</span></label>
                    <select id="place" name="place" required disabled>
                        <option value="">Select a place</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="Concrete">Concrete <span class="required">*</span></label>
                    <select id="Concrete" name="Concrete" required>
                        <option value="">Select a Concrete</option>
                        <option value="CY 210 KSC./7 DAYS">CY 210 KSC./7 DAYS</option>
                        <option value="CY 280 KSC./7 DAYS">CY 280 KSC./7 DAYS</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="contract">Size <span class="required">*</span></label>
                    <select id="Size" name="Size" required>
                        <option value="">Select a Size</option>
                        <option value="Small">รถโม่เล็ก</option>
                        <option value="Big">รถโม่ใหญ่</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="Amount">จำนวน <span class="required">*</span></label>
                    <input type="Amount" id="Amount" name="Amount" placeholder="จำนวนต่อวัน" required>
                </div>

               <div class="form-group">
                    <label for="timeSlot">Time Slot <span class="required">*</span></label>
                    <select id="timeSlot" name="timeSlot" required>
                        <option value="">Select a time</option>
                        <option value="09:00 AM">09:00 AM</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="11:00 AM">11:00 AM</option>
                        <option value="12:00 PM">12:00 PM</option>
                        <option value="01:00 PM">01:00 PM</option>
                        <option value="02:00 PM">02:00 PM</option>
                        <option value="03:00 PM">03:00 PM</option>
                        <option value="04:00 PM">04:00 PM</option>
                        <option value="05:00 PM">05:00 PM</option>
                        <option value="06:00 PM">06:00 PM</option>
                    </select>
                </div>
            </div>
            
            
            <div class="form-row">
                <div class="form-group">
                    <label for="reservationDate">Reservation Date <span class="required">*</span></label>
                    <input type="date" id="reservationDate" name="reservationDate" required>
                </div>
                
                <div class="form-group">
                    <label for="reservationDate">Reservation Date <span class="required">*</span></label>
                    <input type="date" id="reservationDate" name="reservationDate" required>
                </div>
            </div>
    

            <div class="form-row">
                <div class="form-group">
                    <label for="email">ช่างหน้างาน <span class="required">*</span></label>
                    <input type="Name" id="Name" name="Name" placeholder="ชื่อช่าง" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">เบอร์โทรศัพท์</label>
                    <input type="tel" id="phone" name="phone" placeholder="123-456-7899" required>
                </div>
            </div>
                
            <div class="form-group">
                <label for="specialRequests">Special Requests</label>
                <textarea id="specialRequests" name="specialRequests" placeholder="Any special requirements or preferences..."></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i> Submit Reservation
                </button>
                <button type="reset" class="btn-reset">
                    <i class="fas fa-redo"></i> Clear Form
                </button>
            </div>
        </form>
    </div>

    <script>
        // Define the relationship between contracts and places
        const contractPlaceMapping = {
            'Contract A': ['Place A1', 'Place A2', 'Place A3'],
            'Contract B': ['Place B1', 'Place B2'],
            'Contract C': ['Place C1', 'Place C2', 'Place C3', 'Place C4']
        };

        // Handle contract change event
        document.getElementById('contract').addEventListener('change', function() {
            const selectedContract = this.value;
            const placeSelect = document.getElementById('place');
            
            // Clear existing options except the first one
            placeSelect.innerHTML = '<option value="">Select a place</option>';
            
            if (selectedContract && contractPlaceMapping[selectedContract]) {
                // Enable the place dropdown and add options
                placeSelect.disabled = false;
                contractPlaceMapping[selectedContract].forEach(place => {
                    const option = document.createElement('option');
                    option.value = place;
                    option.textContent = place;
                    placeSelect.appendChild(option);
                });
            } else {
                // Disable if no contract selected
                placeSelect.disabled = true;
            }
        });

        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('reservationDate').setAttribute('min', today);

        // Form submission
        document.getElementById('reservationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                contract: document.getElementById('contract').value,
                place: document.getElementById('place').value,
                reservationDate: document.getElementById('reservationDate').value,
                timeSlot: document.getElementById('timeSlot').value,
                numberOfGuests: document.getElementById('numberOfGuests').value,
                specialRequests: document.getElementById('specialRequests').value
            };

            showLoading(true);
            
            google.script.run
                .withSuccessHandler(function(result) {
                    showLoading(false);
                    if (result.success) {
                        showAlert(result.message, 'success');
                        document.getElementById('reservationForm').reset();
                        // Reset place dropdown when form resets
                        document.getElementById('place').disabled = true;
                    } else {
                        showAlert(result.message, 'error');
                    }
                })
                .withFailureHandler(function(error) {
                    showLoading(false);
                    showAlert('Error: ' + error, 'error');
                })
                .saveReservation(formData);
        });

        function showAlert(message, type) {
            const alert = document.getElementById('alertMessage');
            alert.textContent = message;
            alert.className = 'alert ' + type;
            
            if (type === 'success') {
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 4000);
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
