  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans Thai', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(160deg, #f7f5f3 0%, #ede9e5 50%, #e4ddd6 100%);
      color: #2d2620;
    }

    /* ── Header ── */
    header {
      background: #f5f1ed;
      padding: 20px 24px;
      box-shadow: 0 2px 16px rgba(45, 38, 32, 0.08);
      text-align: center;
      position: relative;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: #b8a393;
      border-radius: 2px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #2d2620;
    }

    .logo span {
      color: #9c8575;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 400;
      color: #8a7d73;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 40px;
      gap: 16px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 500;
      color: #a0958a;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    /* ── Buttons ── */
    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 380px;
      padding: 18px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 17px;
      color: #2d2620;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 32px rgba(45, 38, 32, 0.12);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .btn-text small {
      font-size: 12px;
      font-weight: 400;
      color: #8a7d73;
    }

    .btn-arrow {
      margin-left: auto;
      opacity: 0;
      transform: translateX(-8px);
      transition: all 0.25s ease;
      color: #8a7d73;
    }

    .btn:hover .btn-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* Button Variants */
    .btn-requisition {
      background: #d4c4b8;
    }
    .btn-requisition:hover { background: #ccbcaf; }
    .btn-requisition .btn-icon { background: rgba(45, 38, 32, 0.1); }

    .btn-transfer {
      background: #c9bdb3;
    }
    .btn-transfer:hover { background: #c0b3a8; }
    .btn-transfer .btn-icon { background: rgba(45, 38, 32, 0.1); }

    .btn-received {
      background: #d4c4b8;
    }
    .btn-received:hover { background: #ccbcaf; }
    .btn-received .btn-icon { background: rgba(45, 38, 32, 0.1); }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 20px 24px;
      font-size: 12px;
      color: #a0958a;
    }

    .user-email {
      font-size: 12px;
      color: #8a7d73;
      margin-bottom: 4px;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .logo { font-size: 24px; }
      .btn { padding: 16px 20px; font-size: 16px; }
      .btn-icon { width: 38px; height: 38px; }
      main { padding: 36px 16px 32px; }
    }
  </style>
</head>
